<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Defesa em profundidade: o cabeçalho HTTP em public/_headers é a
         configuração autoritativa (contracts/security-and-headers.md). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com; base-uri 'none'; object-src 'none'"
    />

    <title>Pet Shop e Banho e Tosa na Vila Mariana | Patas Felizes</title>
    <link rel="canonical" href="https://www.patasfelizes.com.br/" />
    <meta name="theme-color" content="#1d4b4a" />

    <!-- As meta tags de descrição, geo, Open Graph e Twitter são injetadas
         aqui no build, derivadas de src/content/business.ts (FR-027/FR-031). -->
    <!--app-meta-->

    <!-- Dados estruturados PetStore, derivados de `business` (FR-028). -->
    <!--app-jsonld-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preloads do caminho crítico (fontes e imagem do hero) são injetados no
         build: os caminhos só existem com hash depois da compilação, e um
         preload apontando para /src/assets/... é descartado pelo Vite. -->
    <!--app-preload-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
